services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lizmo
      POSTGRES_USER: lizmo
      POSTGRES_PASSWORD: lizmo_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lizmo -d lizmo"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3
      DEFAULT_REGION: ap-southeast-1
    ports:
      # 4566 on the host is taken by another project's LocalStack; container port is unchanged
      - "4567:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls s3://lizmo-uploads-local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/lizmo
      DB_USER: lizmo
      DB_PASSWORD: lizmo_dev
      AWS_S3_ENDPOINT: http://localstack:4566
      AWS_S3_BUCKET: lizmo-uploads-local
      AWS_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      JWT_SECRET: dev-only-secret-change-me-dev-only-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      # 8080/8081 on the host are taken by the admissions-ph stack; container port is unchanged
      - "8082:8080"

volumes:
  pgdata:
  localstack_data:
