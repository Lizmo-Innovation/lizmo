spring:
  application:
    name: lizmo-api
  servlet:
    multipart:
      # Belt and braces with TenantDocumentService's own 10MB check. This stops
      # the bytes at the door; that returns a message a client can show. The
      # request limit is a little higher to leave room for the form fields
      # around the file.
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    # Mailpit in development, a real relay in anything else. The API speaks
    # plain SMTP either way, so switching provider is this block and nothing
    # else.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      # Otherwise a dead mail server hangs the request that triggered it.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  datasource:
    # Credentials belong in DB_USER and DB_PASSWORD, not in DB_URL. Both work,
    # but pgjdbc gives URL query parameters precedence over the properties set
    # here -- so a URL carrying ?user=&password= silently wins and these two are
    # ignored, which is a confusing half hour when the wrong one is stale.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lizmo}
    username: ${DB_USER:lizmo}
    password: ${DB_PASSWORD:lizmo_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # Keeps the generated Dart client stable: without this the operation ids are
  # derived from method signatures and shift whenever a parameter changes.
  use-fqn: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

lizmo:
  # Browser origins allowed to call the API. The admin web app needs this in
  # every environment; the extra localhost ports are for Flutter web during
  # development. Set LIZMO_CORS_ORIGINS in production.
  cors:
    allowed-origins: ${LIZMO_CORS_ORIGINS:http://localhost:8083,http://localhost:8084,http://localhost:8090,http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-ttl: PT1H
    refresh-token-ttl: P30D
  mail:
    from: ${MAIL_FROM:Lizmo <hello@lizmo.local>}

  app:
    # Where an invitation link points. There is no domain yet, so this is
    # configured rather than assumed: a LAN address while testing on two
    # phones, a real host later. Until the apps register a deep link, tapping
    # it opens a browser -- the email carries the token in text for that.
    invite-base-url: ${LIZMO_INVITE_BASE_URL:http://localhost:8082/invite}

  # Who may run /internal/jobs/*. Both blank by default, which refuses every
  # job: an endpoint that defaults to open is worse than one that never runs,
  # because the second gets noticed.
  jobs:
    service-account: ${LIZMO_JOBS_SERVICE_ACCOUNT:}
    audience: ${LIZMO_JOBS_AUDIENCE:}

  # Notifications to phones as well as the bell. Off unless switched on:
  # locally there is no Firebase to reach. On in Cloud Run, with Firebase in
  # the same project the API runs in.
  push:
    enabled: ${LIZMO_PUSH_ENABLED:false}
    firebase-project: ${LIZMO_FIREBASE_PROJECT:}

  s3:
    bucket: ${AWS_S3_BUCKET:lizmo-uploads-local}
    region: ${AWS_REGION:ap-southeast-1}
    endpoint: ${AWS_S3_ENDPOINT:}
