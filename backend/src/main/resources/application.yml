spring:
  application:
    name: lizmo-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lizmo}
    username: ${DB_USER:lizmo}
    password: ${DB_PASSWORD:lizmo_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # Keeps the generated Dart client stable: without this the operation ids are
  # derived from method signatures and shift whenever a parameter changes.
  use-fqn: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

lizmo:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-ttl: PT1H
    refresh-token-ttl: P30D
  s3:
    bucket: ${AWS_S3_BUCKET:lizmo-uploads-local}
    region: ${AWS_REGION:ap-southeast-1}
    endpoint: ${AWS_S3_ENDPOINT:}
