plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'app.lizmo'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    awsSdkVersion = '2.28.11'
    jjwtVersion = '0.12.6'
    springdocVersion = '2.6.0'
    // 1.20.x negotiates a Docker API version that Engine 29+ rejects with a
    // bare HTTP 400 on /info, which surfaces misleadingly as "Could not find a
    // valid Docker environment".
    testcontainersVersion = '1.21.3'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation "software.amazon.awssdk:s3:${awsSdkVersion}"
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    runtimeOnly 'org.postgresql:postgresql'

    // Serves the OpenAPI document the Dart client is generated from.
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // Integration tests run against real Postgres: the schema relies on partial
    // unique indexes and CHECK constraints that H2 does not honour, so an
    // in-memory database would pass while production breaks.
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()

    // docker-java negotiates an API version below the 1.40 floor that Docker
    // Engine 29 enforces, so the daemon answers /info with a bare HTTP 400 and
    // Testcontainers reports the misleading "Could not find a valid Docker
    // environment". Reproduce it with: DOCKER_API_VERSION=1.24 docker info
    //
    // docker-java reads the `api.version` *system property*, not the
    // DOCKER_API_VERSION environment variable — setting the env var alone
    // changed nothing. 1.44 sits inside the supported range of every Docker
    // version this project cares about.
    systemProperty 'api.version', System.getenv('DOCKER_API_VERSION') ?: '1.44'
    environment 'DOCKER_API_VERSION', System.getenv('DOCKER_API_VERSION') ?: '1.44'
}
