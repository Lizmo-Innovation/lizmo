name: lizmo_ui
description: "Lizmo's shared design system — colour and type tokens plus the widgets from design language v2."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Bundled rather than fetched at runtime: the app must render correctly
  # offline, and google_fonts cannot fetch under `flutter test`, which left
  # every golden rendering fallback type. See fonts/README.md.
  fonts:
    - family: Space Grotesk
      fonts:
        # Variable font with a wght axis; LizmoType drives it via fontVariations.
        - asset: fonts/SpaceGrotesk-Variable.ttf
    - family: Manrope
      fonts:
        - asset: fonts/Manrope-Variable.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
