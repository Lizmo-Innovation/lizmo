server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Flutter web is a single-page app: every route resolves to index.html and is
  # handled client-side.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Everything is revalidated rather than cached hard, because Flutter web does
  # not fingerprint its output: main.dart.js, flutter_bootstrap.js and
  # assets/... all keep the same filenames across builds. Serving them
  # "immutable" pins a visitor to whichever build they first loaded — a stale
  # app that no redeploy can dislodge, since index.html points at the same
  # unchanged names.
  #
  # This bit us locally: the console kept serving a pre-auth build that skipped
  # the login screen entirely, while the container held the current one.
  #
  # "no-cache" does not mean "do not cache" — the browser still stores the file
  # and revalidates with an ETag, so unchanged assets come back as a 304 with no
  # body. The cost is one small request per asset, which is the right trade for
  # an internal console.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|otf|wasm|json)$ {
    add_header Cache-Control "no-cache";
  }

  # CanvasKit is versioned by path, so it is genuinely safe to pin.
  location /canvaskit/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
