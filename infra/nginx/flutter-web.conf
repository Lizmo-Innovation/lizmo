server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Flutter web is a single-page app: every route resolves to index.html and is
  # handled client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets are safe to cache hard; index.html must not be, or
  # clients pin to a stale bundle after a redeploy.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|otf|wasm)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
